<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Загрузка товара...">
  <title>Товар — СвежМаркет</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header" role="banner">
    <div class="container header__inner">
      <a href="index.html" class="logo" aria-label="СвежМаркет — на главную">
        <span class="logo__icon">🥬</span>
        <span class="logo__text">СвежМаркет</span>
      </a>

      <div class="search" role="search">
        <label for="search-input" class="visually-hidden">Поиск товаров</label>
        <input type="search" id="search-input" class="search__input" placeholder="Найти продукты..." autocomplete="off">
        <button type="button" class="search__btn" aria-label="Искать">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <ul id="search-suggestions" class="search__suggestions" role="listbox" hidden></ul>
      </div>

      <nav class="header__actions">
        <button type="button" class="header__cart-btn" id="cart-toggle" aria-label="Открыть корзину">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge" id="cart-count" aria-live="polite">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="product-page">
    <div class="container">
      <nav class="breadcrumb" aria-label="Хлебные крошки">
        <a href="index.html">Главная</a>
        <span aria-hidden="true">/</span>
        <a href="index.html#catalog" id="breadcrumb-category">Каталог</a>
        <span aria-hidden="true">/</span>
        <span id="breadcrumb-product" aria-current="page">Товар</span>
      </nav>

      <article class="product-detail" id="product-detail">
        <p class="loading">Загрузка товара...</p>
      </article>

      <!-- Блок рецептов -->
      <section class="recipes" id="recipes-section" aria-labelledby="recipes-title" hidden>
        <h2 id="recipes-title" class="section-title">Рецепты с этим продуктом</h2>
        <div class="recipes__grid" id="recipes-grid"></div>
      </section>
    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container footer__inner">
      <div class="footer__brand">
        <span class="logo__icon">🥬</span>
        <span class="logo__text">СвежМаркет</span>
        <p class="footer__copy">&copy; 2026 СвежМаркет</p>
      </div>
    </div>
  </footer>

  <aside class="cart-panel" id="cart-panel" aria-label="Корзина" aria-hidden="true">
    <div class="cart-panel__overlay" id="cart-overlay"></div>
    <div class="cart-panel__drawer">
      <header class="cart-panel__header">
        <h2 class="cart-panel__title">Корзина</h2>
        <button type="button" class="cart-panel__close" id="cart-close" aria-label="Закрыть корзину">&times;</button>
      </header>
      <div class="cart-panel__body" id="cart-items">
        <p class="cart-panel__empty">Корзина пуста</p>
      </div>
      <footer class="cart-panel__footer">
        <div class="cart-panel__total">
          <span>Итого:</span>
          <span id="cart-total" aria-live="polite">0 ₽</span>
        </div>
        <button type="button" class="btn btn--primary btn--block" id="checkout-btn" disabled>Оформить заказ</button>
      </footer>
    </div>
  </aside>

  <script src="data/products-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/seo.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/search.js"></script>
  <script src="js/product-page.js"></script>
</body>
</html>
